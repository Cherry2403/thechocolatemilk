services:
  postgres:
    image: postgres:16
    container_name: thechocolatemilk_db
    environment:
      POSTGRES_USER: thechocolatemilk
      POSTGRES_PASSWORD: thechocolatemilk
      POSTGRES_DB: thechocolatemilk_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
